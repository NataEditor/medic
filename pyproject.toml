[project]
name = "medic"
version = "0.1.0"
description = "Медицинская информационная система для сети клиник"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "celery>=5.4",
    "flower>=2.0",
    "pillow>=11.0",
    "loguru>=0.7",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.17",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "B008",    # Depends() в аргументах — штатный приём FastAPI
    "S101",    # assert допустим в тестах
    "S105",    # false positive на имена полей настроек (secret_key, etc.)
    "S106",
    "RUF001",
    "RUF002",
    "RUF003",  # кириллица в строках и комментариях
    "RUF012",  # мутабельные дефолты в pydantic-схемах валидируются pydantic
    "UP042",     # str, Enum нужен для сериализации в SQLAlchemy
    "UP046",     # Generic[T] синтаксис поддерживается везде
    "ASYNC240",  # синхронные pathlib.Path.exists() допустимы в сервисах
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
package = false
