upstream medic_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Логи в формате, который читает Loguru/Nginx
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    location /health {
        proxy_pass http://medic_api;
        access_log off;
    }

    # МЕДИЦИНСКИЕ ФАЙЛЫ НАПРЯМУЮ НЕ РАЗДАЮТСЯ.
    # Анализы и сканы паспортов лежат в закрытом хранилище (private_media),
    # доступ — только через API с проверкой прав и аудитом ПДн (152-ФЗ).
    # Любой запрос к /media/ уходит в приложение, где нет публичного роута,
    # поэтому клиент получит 404 вместо файла.
    location /media/ {
        proxy_pass http://medic_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        proxy_pass http://medic_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
